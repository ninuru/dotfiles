# Kitty Configuration

# ## Gruxbox
# include ~/.config/kitty/themes/gruvbox_dark.conf
# include ~/.config/kitty/themes/catppuccin-mocha.conf

## General settings
font_family            FiraCode
# font_family            Jetbrains Mono
# font_family            UbuntuMono Nerd Font
font_size              12.5
enable_audio_bell      no
text_composition_strategy legacy
# clipboard_control      yes

# background              #282828
# Gruvbox
# background              #1c1c1c

# Firefox
# background              #2b2a33

# Catppuccin
# background              #181926

# Grubber Darker
# background              #181818

## Behavior and performance
scrollback_lines       10000
shell_integration      yes
allow_remote_control   yes


## Keybinds
# kitty's legacy encoding sends Ctrl+Shift+Enter as plain Enter and Alt+Shift+Enter as Alt+Enter,
# so send the CSI-u forms explicitly for tmux. This also unmaps kitty's default new_window split.
map ctrl+shift+enter send_text all \x1b[13;6u
map alt+shift+enter  send_text all \x1b[13;4u
